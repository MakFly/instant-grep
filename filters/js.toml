[[filters]]
name = "tsc"
match = "^(tsc|npx tsc|bunx tsc)"
strip_ansi = true
keep_lines = "(TS\\d+|error TS)"
truncate_at = 200
max_lines = 80
on_empty = "No type errors"

[[filters]]
name = "eslint"
match = "^(eslint|npx eslint|bunx eslint)"
strip_ansi = true
keep_lines = "(\\S+\\.(js|ts|jsx|tsx)|(error|warning)\\s)"
truncate_at = 200
max_lines = 60

[[filters]]
name = "biome"
match = "^(biome|npx biome|bunx biome)"
strip_ansi = true
keep_lines = "(error|warning|✖|×)"
truncate_at = 200
max_lines = 60

[[filters]]
name = "prettier"
match = "^(prettier|npx prettier|bunx prettier)"
strip_ansi = true
keep_lines = "\\S+\\.(js|ts|jsx|tsx|css|json|md)"
max_lines = 40

[[filters]]
name = "pnpm-list"
match = "^pnpm (list|ls)"
strip_ansi = true
truncate_at = 120
max_lines = 40

[[filters]]
name = "npm-install"
match = "^npm install"
strip_ansi = true
keep_lines = "(added|removed|changed|up to date|npm warn|npm ERR|found \\d+ vulnerabilities|packages in)"
max_lines = 30

[[filters]]
name = "npm-run"
match = "^npm run"
strip_ansi = true
drop_lines = "^>"
max_lines = 60
