[[filters]]
name = "kubectl-get"
match = "^kubectl get"
strip_ansi = true
truncate_at = 200
max_lines = 50

[[filters]]
name = "kubectl-logs"
match = "^kubectl logs"
strip_ansi = true
tail = 50
truncate_at = 200

[[filters]]
name = "kubectl-describe"
match = "^kubectl describe"
strip_ansi = true
truncate_at = 200
max_lines = 80

[[filters]]
name = "kubectl-apply"
match = "^kubectl apply"
strip_ansi = true
keep_lines = "(configured|created|unchanged|Error|error|Warning)"
max_lines = 50
on_empty = "No changes applied"

[[filters]]
name = "kubectl-rollout"
match = "^kubectl rollout"
strip_ansi = true
keep_lines = "(successfully rolled|Waiting|error|Error)"
max_lines = 30

[[filters]]
name = "kubectl-events"
match = "^kubectl (get events|events)"
strip_ansi = true
drop_lines = "^\\s*$"
truncate_at = 200
max_lines = 40

[[filters]]
name = "kubectl-top"
match = "^kubectl top"
strip_ansi = true
truncate_at = 120
max_lines = 30

[[filters]]
name = "kubectl-exec"
match = "^kubectl exec"
strip_ansi = true
truncate_at = 200
max_lines = 60

[[filters]]
name = "kubectl-port-forward"
match = "^kubectl port-forward"
strip_ansi = true
keep_lines = "(Forwarding|Handling|error|Error)"
max_lines = 20
