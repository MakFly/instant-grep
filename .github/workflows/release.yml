name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump level (patch = fix, minor = feature, major = breaking)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASES_TO_KEEP: 4

jobs:
  tag:
    name: Bump version & tag (${{ inputs.bump }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump Cargo.toml, commit and push tag
        id: bump
        run: |
          set -euo pipefail
          current=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          IFS=. read -r major minor patch <<< "$current"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          new="$major.$minor.$patch"
          echo "Bumping $current -> $new (${{ inputs.bump }})"
          sed -i "0,/^version = \".*\"/s//version = \"$new\"/" Cargo.toml
          # Keep Cargo.lock in sync with the bumped package version
          cargo update --workspace --offline || cargo update --workspace
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump version to $new"
          git tag "v$new"
          git push origin main "v$new"
          echo "tag=v$new" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    # Tag pushes made with GITHUB_TOKEN don't re-trigger this workflow, so on
    # manual dispatch the build runs here, against the tag the job just created.
    needs: tag
    if: always() && (github.event_name == 'push' || needs.tag.result == 'success')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: ig-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: ig-linux-aarch64
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: ig-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: ig-macos-aarch64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux aarch64)
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build Rust binary
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Stage artifact
        run: |
          mkdir -p release
          cp "target/${{ matrix.target }}/release/ig" "release/${{ matrix.artifact }}"
          chmod +x "release/${{ matrix.artifact }}"

      - name: Sign macOS binary (ad-hoc with stable identifier)
        if: runner.os == 'macOS'
        run: |
          codesign --sign - --force \
            --identifier dev.makfly.ig \
            --options runtime \
            "release/${{ matrix.artifact }}"
          codesign --verify --verbose "release/${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.artifact }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [tag, build]
    if: always() && needs.build.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare binaries + checksums
        run: |
          mkdir -p release/
          for dir in artifacts/ig-*; do
            cp "$dir"/* release/
          done
          chmod +x release/ig-*
          cd release && sha256sum * > checksums.txt
          echo "=== Checksums ==="
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release/ig-linux-x86_64
            release/ig-linux-aarch64
            release/ig-macos-x86_64
            release/ig-macos-aarch64
            release/checksums.txt

  cleanup:
    name: Cleanup Old Releases
    runs-on: ubuntu-latest
    needs: release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete older SemVer releases and tags
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          mapfile -t keep_tags < <(
            git tag --list 'v[0-9]*.[0-9]*.[0-9]*' |
              sort -V |
              tail -n "${RELEASES_TO_KEEP}"
          )

          should_keep() {
            local candidate="$1"
            local keep
            for keep in "${keep_tags[@]}"; do
              if [[ "$keep" == "$candidate" ]]; then
                return 0
              fi
            done
            return 1
          }

          printf 'Keeping %s latest SemVer tags:\n' "${RELEASES_TO_KEEP}"
          printf '  %s\n' "${keep_tags[@]}"

          mapfile -t all_tags < <(
            git tag --list 'v[0-9]*.[0-9]*.[0-9]*' |
              sort -V
          )

          for tag in "${all_tags[@]}"; do
            if should_keep "$tag"; then
              echo "Keeping $tag"
              continue
            fi

            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Deleting release and tag: $tag"
              gh release delete "$tag" --cleanup-tag --yes
            else
              echo "Deleting tag without release: $tag"
              git push origin ":refs/tags/$tag"
            fi
          done
